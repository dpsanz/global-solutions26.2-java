<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bairros | Cidade em Dia de Chuva</title>
    <link rel="stylesheet" th:href="@{/css/tema.css}">
</head>
<body>
<header>
    <nav aria-label="Navegação principal">
        <strong>Cidade em Dia de Chuva</strong>
        <a th:href="@{/bairros}" aria-current="page">Bairros</a>
        <a th:href="@{/trechos}">Trechos</a>
        <a th:href="@{/leituras}">Leituras</a>
    </nav>
</header>
<main>
    <div class="page-heading">
        <h1 id="titulo">Bairros</h1>
        <a class="button primary" th:href="@{/bairros/novo}">Novo bairro</a>
    </div>
    <p class="notice ok" role="status" th:if="${sucesso}" th:text="${sucesso}"></p>
    <p class="notice error" role="alert" th:if="${erro}" th:text="${erro}"></p>

    <div class="table-wrap" role="region" aria-labelledby="titulo" tabindex="0">
        <table aria-labelledby="titulo">
            <thead>
            <tr><th>Nome</th><th>Zona</th><th>Área (km²)</th><th>Ações</th></tr>
            </thead>
            <tbody>
            <tr th:each="bairro : ${bairros}">
                <th scope="row" th:text="${bairro.nome}"></th>
                <td th:text="${bairro.zona}"></td>
                <td th:text="${bairro.areaKm2}"></td>
                <td>
                    <div class="actions">
                        <a class="button" th:href="@{/bairros/{id}/editar(id=${bairro.id})}">Editar</a>
                        <a class="button" th:href="@{/bairros/{id}/painel(id=${bairro.id})}">Painel</a>
                        <form method="post" th:action="@{/bairros/{id}/excluir(id=${bairro.id})}">
                            <button class="danger" type="submit">Excluir</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(bairros)}">
                <td class="empty" colspan="4">Nenhum bairro cadastrado.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
